---
prometheus_node_exporter_version: "1.8.1"
prometheus_node_exporter_arch_map:
  x86_64: linux-amd64
  aarch64: linux-arm64
  armv7l: linux-armv7
  armv6l: linux-armv6
prometheus_node_exporter_arch: "{{ prometheus_node_exporter_arch_map[ansible_architecture] | default('linux-amd64') }}"
prometheus_node_exporter_archive: "node_exporter-{{ prometheus_node_exporter_version }}.{{ prometheus_node_exporter_arch }}"
prometheus_node_exporter_download_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ prometheus_node_exporter_version }}/{{ prometheus_node_exporter_archive }}.tar.gz"
prometheus_node_exporter_download_dir: /tmp
prometheus_node_exporter_install_dir: /usr/local/bin
prometheus_node_exporter_user: node_exporter
prometheus_node_exporter_listen_address: "0.0.0.0:9100"
prometheus_node_exporter_textfile_dir: /var/lib/node_exporter/textfile_collector
prometheus_node_exporter_firewall_port: "9100/tcp"
prometheus_node_exporter_manage_firewall: true
prometheus_node_exporter_firewalld_zone: public
prometheus_node_exporter_service: node_exporter
prometheus_node_exporter_enabled: true
prometheus_node_exporter_state: started
